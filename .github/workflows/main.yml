name: Auto Shortlink Runner (Zero RDP)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target shortlink URL'
        required: true
        default: 'https://ouo.io/QyuW7c'
      expected_domain:
        description: 'Optional destination domain (leave blank to accept any non-ouo site after GET LINK)'
        required: false
        default: ''

jobs:
  run-browser:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Check VM Public IP
        run: curl.exe -s https://api.ipify.org

      - name: Install Dependencies
        run: pip install DrissionPage pyautogui

      - name: Run Human-Like Chrome Automation
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          EXPECTED_DOMAIN: ${{ github.event.inputs.expected_domain }}
          PYTHONUTF8: '1'
        run: |
          @'
          import os, sys, time, random, ctypes
          from urllib.parse import urlparse
          import pyautogui
          from DrissionPage import ChromiumPage, ChromiumOptions

          try:
              ctypes.windll.shcore.SetProcessDpiAwareness(2)
          except Exception:
              pass
          pyautogui.FAILSAFE = False

          OUO_DOMAINS = ('ouo.io', 'ouo.press')
          AD_SKIP_DOMAINS = ('srvqk.com', 'primisemets.com', 'frs2c.com', 'doubleclick.net', 'googlesyndication.com')
          EXPECTED_DOMAIN = os.environ.get('EXPECTED_DOMAIN', '').strip().lower()

          def host_matches(host, domain):
              return host == domain or host.endswith('.' + domain)

          def is_destination_reached(raw_url, clicked_get_link):
              """Returns True once GET LINK has been clicked and the main tab lands on a non-ouo destination."""
              if not raw_url:
                  return False
              low = raw_url.lower().strip()
              if low.startswith(('about:', 'chrome', 'edge:', 'data:')):
                  return False
              try:
                  host = (urlparse(low).hostname or '').lower()
              except Exception:
                  return False
              if not host:
                  return False
              if any(host_matches(host, d) for d in OUO_DOMAINS):
                  return False
              if EXPECTED_DOMAIN:
                  return host_matches(host, EXPECTED_DOMAIN)
              if not clicked_get_link:
                  return False
              if any(host_matches(host, d) for d in AD_SKIP_DOMAINS) or '/redirect?' in low:
                  return False
              return True

          def click_cf_os(page):
              """Finds the HTML text above Turnstile and performs a real OS mouse click on the checkbox."""
              anchor = (
                  page.ele('text:This website uses a security service', timeout=1)
                  or page.ele('text:Performing security verification', timeout=1)
              )
              if anchor:
                  try:
                      anchor.scroll.to_see()
                      time.sleep(0.3)
                  except Exception:
                      pass
                  ax, ay = anchor.rect.screen_location
                  aw, ah = anchor.rect.size
                  if ah > 0:
                      target_x = int(ax + 22 + random.randint(-3, 3))
                      target_y = int(ay + ah + 62 + random.randint(-3, 3))
                      print(f'[+] Moving real mouse to CF checkbox ({target_x}, {target_y})...', flush=True)
                      pyautogui.moveTo(
                          max(10, target_x - random.randint(40, 90)),
                          max(10, target_y + random.randint(-30, 30)),
                          duration=0.3
                      )
                      pyautogui.moveTo(target_x, target_y, duration=random.uniform(0.4, 0.7))
                      time.sleep(random.uniform(0.1, 0.25))
                      pyautogui.click()
                      return True

              for sel in ('css:iframe[src*="challenges.cloudflare.com"]', 'css:div.cf-turnstile'):
                  el = page.ele(sel, timeout=0.5)
                  if el and el.rect.size[0] > 0 and el.rect.size[1] > 0:
                      try:
                          el.scroll.to_see()
                          time.sleep(0.3)
                      except Exception:
                          pass
                      ex, ey = el.rect.screen_location
                      target_x = int(ex + 28)
                      target_y = int(ey + 32)
                      print(f'[+] Fallback OS click on CF widget ({target_x}, {target_y})...', flush=True)
                      pyautogui.moveTo(target_x, target_y, duration=0.5)
                      pyautogui.click()
                      return True
              return False

          url = os.environ['TARGET_URL'].strip()
          page = None
          w, h = random.choice([(1024, 768), (1000, 750), (980, 730), (960, 720)])

          for attempt in range(1, 4):
              try:
                  co = ChromiumOptions().auto_port()
                  co.set_argument('--window-position=0,0')
                  co.set_argument(f'--window-size={w},{h}')
                  co.set_argument('--disable-popup-blocking')
                  co.set_argument('--disable-notifications')
                  co.set_argument('--no-first-run')
                  co.set_argument('--no-default-browser-check')
                  co.set_argument('--no-sandbox')
                  co.set_argument('--disable-gpu')
                  page = ChromiumPage(co)
                  break
              except Exception as e:
                  print(f'[!] Chrome launch attempt {attempt}/3 failed: {e}', flush=True)
                  os.system('taskkill /F /IM chrome.exe >nul 2>&1')
                  time.sleep(3)

          if not page:
              raise RuntimeError('Failed to connect to Chrome after 3 attempts.')

          referrers = [
              'https://www.youtube.com/',
              'https://www.google.com/',
              'https://www.facebook.com/',
              'https://t.co/',
          ]
          chosen_ref = random.choice(referrers)
          print(f'[*] Opening {url} (Viewport: {w}x{h} | Referer: {chosen_ref})...', flush=True)

          try:
              page.run_cdp('Page.navigate', url=url, referrer=chosen_ref)
              time.sleep(3)
          except Exception:
              page.get(url)

          main_tab = page.tab_id
          start = time.time()
          last_log = 0
          last_url = url
          cf_attempts = 0
          clicked_get_link = False
          reached_destination = False
          final_dest_url = ''

          try:
              while time.time() - start < 130:
                  # 1. Handle ad tabs / popup windows
                  if len(page.tab_ids) > 1:
                      for tid in list(page.tab_ids):
                          if tid != main_tab:
                              try:
                                  ad_tab = page.get_tab(tid)
                                  ad_url = ad_tab.url or ''
                                  if EXPECTED_DOMAIN and is_destination_reached(ad_url, clicked_get_link):
                                      final_dest_url = ad_url
                                      print(f'[+] Destination opened in new tab: {final_dest_url}', flush=True)
                                      time.sleep(random.uniform(5.0, 8.0))
                                      reached_destination = True
                                      break
                                  wait_s = random.uniform(9.0, 13.0)
                                  print(f'[*] Ad tab ({ad_url[:45]}...) - waiting {wait_s:.1f}s for impression...', flush=True)
                                  time.sleep(wait_s)
                                  ad_tab.close()
                              except Exception:
                                  pass
                      if reached_destination:
                          break
                      try:
                          page.activate_tab(main_tab)
                      except Exception:
                          pass
                      time.sleep(1.5)

                  cur_url = page.url or ''
                  cur_url_lower = cur_url.lower()
                  cur_title = (page.title or '').strip()
                  last_url = cur_url

                  if time.time() - last_log >= 8:
                      elapsed = int(time.time() - start)
                      print(f'[*] [{elapsed}s] Title: "{cur_title}" | URL: {cur_url}', flush=True)
                      last_log = time.time()

                  # 2. Check if final destination is reached on main tab
                  if is_destination_reached(cur_url, clicked_get_link):
                      final_dest_url = cur_url
                      print(f'[+] Final destination reached: {final_dest_url}', flush=True)
                      time.sleep(random.uniform(5.0, 8.0))
                      reached_destination = True
                      break

                  # 3. Handle Cloudflare Turnstile with real OS click + stuck-challenge refresh
                  if 'just a moment' in cur_title.lower() or page.ele('text:Performing security verification', timeout=0.5):
                      if cf_attempts >= 3:
                          print('[*] Turnstile stuck after 3 clicks - refreshing page...', flush=True)
                          page.refresh()
                          cf_attempts = 0
                          time.sleep(5.0)
                          continue
                      if click_cf_os(page):
                          cf_attempts += 1
                          time.sleep(random.uniform(6.0, 8.0))
                      else:
                          time.sleep(3.0)
                      continue

                  cf_attempts = 0

                  # 4. Step 1: Click I'M A HUMAN
                  if '/go/' not in cur_url_lower:
                      human_btn = (
                          page.ele('#btn-main', timeout=0.5)
                          or page.ele('tag:button@@text():HUMAN', timeout=0.5)
                          or page.ele("text:I'M A HUMAN", timeout=0.5)
                      )
                      if human_btn and human_btn.states.is_displayed:
                          time.sleep(random.uniform(2.0, 3.5))
                          print("[+] Clicking I'M A HUMAN...", flush=True)
                          try:
                              human_btn.scroll.to_see()
                          except Exception:
                              pass
                          human_btn.click()
                          time.sleep(random.uniform(3.0, 4.5))
                          continue

                  # 5. Step 2 (/go/ page): Wait for countdown, then click GET LINK
                  if '/go/' in cur_url_lower:
                      page_html = page.html or ''
                      if '>3<' in page_html or '>2<' in page_html or '>1<' in page_html:
                          print('[*] Waiting for countdown...', flush=True)
                          time.sleep(1.5)
                          continue

                      get_btn = (
                          page.ele('#btn-main', timeout=0.5)
                          or page.ele('tag:button@@text():GET LINK', timeout=0.5)
                          or page.ele('text:GET LINK', timeout=0.5)
                      )
                      if get_btn and get_btn.states.is_displayed:
                          print('[+] Clicking GET LINK...', flush=True)
                          time.sleep(random.uniform(1.0, 2.0))
                          try:
                              get_btn.scroll.to_see()
                          except Exception:
                              pass
                          get_btn.click()
                          clicked_get_link = True
                          time.sleep(random.uniform(3.0, 4.5))
                          continue

                  time.sleep(2)
          finally:
              page.quit()

          if not reached_destination:
              print(f'[!] FAILED: Timed out after 130s before reaching destination. Last URL: {last_url}', flush=True)
              sys.exit(1)

          print(f'[+] SUCCESS: Verified destination ({final_dest_url}). VM shutting down.', flush=True)
          '@ | Set-Content -Path bot.py -Encoding UTF8
          python -u bot.py
